name: CI/CD Pipeline - ISD Airbnb Monolith

on:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/**"
      - "backend/monolith/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vercel.json"
      - "docker-compose.yml"
      - "render.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/**"
      - "backend/monolith/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vercel.json"
      - "docker-compose.yml"
      - "render.yaml"

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"
  DOCKER_REGISTRY: docker.io
  IMAGE_PREFIX: isd-airbnb

jobs:
  build-backend:
    name: Build & Test - Monolith
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-monolith-${{ hashFiles('backend/monolith/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-monolith-
            ${{ runner.os }}-maven-

      - name: Build monolith
        working-directory: backend/monolith
        run: mvn clean package -DskipTests -B --no-transfer-progress

      - name: Run backend tests
        working-directory: backend/monolith
        run: mvn test -B --no-transfer-progress
        env:
          MONGO_URI_USER: ${{ secrets.MONGO_URI_USER_TEST }}
          MONGO_URI_BOOKING: ${{ secrets.MONGO_URI_BOOKING_TEST }}
          MONGO_URI_REVIEWS: ${{ secrets.MONGO_URI_REVIEWS_TEST }}
          MONGO_URI_NOTIFICATION: ${{ secrets.MONGO_URI_NOTIFICATION_TEST }}
          MONGO_URI_AVAILABILITY: ${{ secrets.MONGO_URI_AVAILABILITY_TEST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_TEST }}
          FRONTEND_BASE_URL: http://localhost:3000

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: monolith-jar
          path: backend/monolith/target/*.jar
          retention-days: 7

  build-frontend:
    name: Test & Build - React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false
        env:
          CI: true

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
          REACT_APP_ENV: production
          CI: false

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  docker-build:
    name: Docker Build - Monolith
    needs:
      - build-backend
      - build-frontend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/monolith
          file: backend/monolith/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_PREFIX }}-monolith:latest
          cache-from: type=gha,scope=monolith
          cache-to: type=gha,mode=max,scope=monolith

  notify:
    name: Pipeline Summary
    needs:
      - build-backend
      - build-frontend
      - docker-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline result
        run: |
          echo "=============================================="
          echo " ISD Airbnb monolith pipeline complete"
          echo "=============================================="
          echo " Branch    : ${{ github.ref_name }}"
          echo " Commit    : ${{ github.sha }}"
          echo " Trigger   : ${{ github.event_name }}"
          echo " Backend   : ${{ needs.build-backend.result }}"
          echo " Frontend  : ${{ needs.build-frontend.result }}"
          echo " Docker    : ${{ needs.docker-build.result }}"
          echo "=============================================="
