server:
  port: 8083

spring:
  application:
    name: payment-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://tanim:tanim@cluster0.mongodb.net/paymentdb?retryWrites=true&w=majority&appName=ISD+Airbnb}

  # Docker profile overrides
  config:
    activate:
      on-profile: docker

---
spring:
  config:
    activate:
      on-profile: default

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.airbnb.payment: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
