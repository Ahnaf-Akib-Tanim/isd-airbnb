server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0

        - id: booking-service
          uri: http://booking-service:8082
          predicates:
            - Path=/api/bookings/**
          filters:
            - StripPrefix=0

        - id: payment-service
          uri: http://payment-service:8083
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=0

        - id: listing-service
          uri: http://listing-service:8084
          predicates:
            - Path=/api/listings/**
          filters:
            - StripPrefix=0

        - id: availability-service
          uri: http://availability-service:8085
          predicates:
            - Path=/api/availability/**
          filters:
            - StripPrefix=0

        - id: search-service
          uri: http://search-service:8086
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=0

        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=0

        - id: admin-service
          uri: http://admin-service:8088
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=0

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - AddResponseHeader=X-Gateway, ISD-Airbnb-Gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
