server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0

        - id: message-service
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/messages/**
          filters:
            - StripPrefix=0

        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://booking-service:8082}
          predicates:
            - Path=/api/bookings/**
          filters:
            - StripPrefix=0

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8083}
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=0

        - id: listing-service
          uri: ${LISTING_SERVICE_URL:http://listing-service:8084}
          predicates:
            - Path=/api/listings/**
          filters:
            - StripPrefix=0

        - id: availability-service
          uri: ${AVAILABILITY_SERVICE_URL:http://availability-service:8085}
          predicates:
            - Path=/api/availability/**
          filters:
            - StripPrefix=0

        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://search-service:8086}
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=0

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8087}
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=0

        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://admin-service:8088}
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=0

        - id: review-service
          uri: ${REVIEW_SERVICE_URL:http://review-service:8089}
          predicates:
            - Path=/api/reviews/**
          filters:
            - StripPrefix=0

      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "${FRONTEND_URL:https://airbnb154.vercel.app}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - AddResponseHeader=X-Gateway, ISD-Airbnb-Gateway
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
