server:
  port: 8082

spring:
  application:
    name: booking-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://tanim:tanim@cluster0.mongodb.net/bookingdb?retryWrites=true&w=majority&appName=ISD+Airbnb}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# App Info
info:
  app:
    name: Booking Service
    description: Handles booking creation, status transitions, and booking history
    version: 1.0.0

# Logging
logging:
  level:
    root: INFO
    com.airbnb.booking: DEBUG
    org.springframework.data.mongodb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/booking-service.log

# Booking Service Config
booking:
  status:
    allowed-transitions:
      PENDING:
        - CONFIRMED
        - CANCELLED
        - FAILED
      CONFIRMED:
        - CHECKED_IN
        - CANCELLED
      CHECKED_IN:
        - CHECKED_OUT
      CHECKED_OUT: []
      CANCELLED:
        - REFUNDED
      FAILED: []
      REFUNDED: []
  refund:
    full-refund-days-before: 7
    partial-refund-percentage: 50

# Service URLs (for inter-service communication)
services:
  user-service:
    url: ${USER_SERVICE_URL:http://user-service:8081}
  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://payment-service:8083}
  availability-service:
    url: ${AVAILABILITY_SERVICE_URL:http://availability-service:8085}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8087}

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}

logging:
  level:
    root: INFO
    com.airbnb.booking: INFO

---
spring:
  config:
    activate:
      on-profile: test
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://tanim:tanim@cluster0.mongodb.net/bookingdb-test?retryWrites=true&w=majority&appName=ISD+Airbnb}

logging:
  level:
    root: WARN
    com.airbnb.booking: DEBUG
