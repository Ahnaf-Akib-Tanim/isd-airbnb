server:
  port: 8088

spring:
  application:
    name: admin-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.airbnb.admin: DEBUG

jwt:
  secret: ${JWT_SECRET:defaultSuperSecretKeyForDevOnlyChangeInProd}

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
