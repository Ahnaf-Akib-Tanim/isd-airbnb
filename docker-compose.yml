services:
  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - user-service
      - booking-service
      - payment-service
      - listing-service
      - availability-service
      - search-service
      - notification-service
      - admin-service
    networks:
      - airbnb-network
    restart: unless-stopped

  user-service:
    build: ./backend/user-service
    container_name: user-service
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGO_URI_USER}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-86400000}
      - NOTIFICATION_SERVICE_URL=http://notification-service:8087
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      - SPRING_PROFILES_ACTIVE=docker
      - HOST_SEED_ENABLED=false
      - HOST_SEED_COUNT=10
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    networks:
      - airbnb-network
    restart: unless-stopped

  booking-service:
    build: ./backend/booking-service
    container_name: booking-service
    ports:
      - "${BOOKING_SERVICE_PORT:-8082}:8082"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGO_URI_BOOKING}
      - SPRING_PROFILES_ACTIVE=docker
      - NOTIFICATION_SERVICE_URL=http://notification-service:8087
    networks:
      - airbnb-network
    restart: unless-stopped

  payment-service:
    build: ./backend/payment-service
    container_name: payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT:-8083}:8083"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGO_URI_PAYMENT}
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - airbnb-network
    restart: unless-stopped

  listing-service:
    build: ./backend/listing-service
    container_name: listing-service
    ports:
      - "${LISTING_SERVICE_PORT:-8084}:8084"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGO_URI_LISTING}
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - airbnb-network
    restart: unless-stopped

  availability-service:
    build: ./backend/availability-service
    container_name: availability-service
    ports:
      - "${AVAILABILITY_SERVICE_PORT:-8085}:8085"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGO_URI_AVAILABILITY}
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - airbnb-network
    restart: unless-stopped

  search-service:
    build: ./backend/search-service
    container_name: search-service
    ports:
      - "${SEARCH_SERVICE_PORT:-8086}:8086"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGO_URI_SEARCH}
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - airbnb-network
    restart: unless-stopped

  notification-service:
    build: ./backend/notification-service
    container_name: notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8087}:8087"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGO_URI_NOTIFICATION}
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - airbnb-network
    restart: unless-stopped

  admin-service:
    build: ./backend/admin-service
    container_name: admin-service
    ports:
      - "${ADMIN_SERVICE_PORT:-8088}:8088"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - USER_SERVICE_URL=http://user-service:8081
      - NOTIFICATION_SERVICE_URL=http://notification-service:8087
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - airbnb-network
    restart: unless-stopped

  review-service:
    build: ./backend/review-service
    container_name: review-service
    ports:
      - "${REVIEW_SERVICE_PORT:-8089}:8089"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGO_URI_REVIEWS}
      - SPRING_PROFILES_ACTIVE=docker
      - USER_SERVICE_URL=http://user-service:8081
    depends_on:
      - user-service
    networks:
      - airbnb-network
    restart: unless-stopped

networks:
  airbnb-network:
    driver: bridge
